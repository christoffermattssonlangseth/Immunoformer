[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "immunotransformer"
version = "0.0.1"
description = "Cell-token transformer for EAE/RR-EAE Xenium spatial data (Stage 1 baseline)"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "anndata>=0.10",
    "scanpy>=1.10",
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "pyyaml>=6.0",
    "tqdm>=4.66",
]

[tool.setuptools.packages.find]
include = ["immunotransformer*"]
